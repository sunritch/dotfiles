set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -sa terminal-features ",*:hyperlinks"
set -s focus-events on
#set -g allow-passthrough on
#set -g set-clipboard on
set -g remain-on-exit failed

set -g allow-rename off
set -g mouse on
set -g history-limit 100000
set -g renumber-windows on
set -g aggressive-resize on
setw -g mode-keys vi
set -g status-keys vi
set -g detach-on-destroy off
set -s extended-keys on
set -sq extended-keys-format csi-u

set -g set-titles on
set -g status-style "bg=default,fg=default"
if-shell '. "$HOME/.profile"; [ "$DOTFILES_ENV" = prod ]' 'set -g status-left "#[bold,reverse,fg=red] PROD #[default][#S] "'
if-shell '. "$HOME/.profile"; [ "$DOTFILES_ENV" = staging ]' 'set -g status-left "#[bold,reverse,fg=yellow] STG #[default][#S] "'